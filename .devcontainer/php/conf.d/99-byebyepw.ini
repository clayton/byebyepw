; Bye Bye Passwords LAMP devcontainer PHP settings
; Surface PHP 8.6 / 8.x deprecations in logs without corrupting JSON/WebAuthn AJAX responses.
error_reporting = E_ALL
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2

memory_limit = 512M
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 120
max_input_vars = 3000
